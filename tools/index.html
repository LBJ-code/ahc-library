  <h1>tools: 提出前に1ファイルへ</h1>
  <p>AtCoderへ出す前、ローカルの部品を順番に展開します。実行はPython標準機能だけです。</p>
  <svg viewBox="0 0 800 230" role="img" aria-labelledby="tool-title tool-desc">
    <title id="tool-title">amalgamateの流れ</title>
    <desc id="tool-desc">main.cppと2つのヘッダを読み、1つのsubmission.cppへまとめる</desc>
    <rect x="25" y="70" width="170" height="90" rx="14" fill="#7c3aed"/><text x="110" y="108" text-anchor="middle" fill="white" font-size="21">main.cpp</text><text x="110" y="137" text-anchor="middle" fill="white">include</text>
    <path d="M205 115H270" stroke="currentColor" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="280" y="30" width="180" height="70" rx="14" fill="#64748b"/><text x="370" y="73" text-anchor="middle" fill="white">grid.hpp</text>
    <rect x="280" y="130" width="180" height="70" rx="14" fill="#64748b"/><text x="370" y="173" text-anchor="middle" fill="white">other.hpp</text>
    <path d="M470 65L535 100M470 165L535 130" stroke="currentColor" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="545" y="70" width="230" height="90" rx="14" fill="#059669"/><text x="660" y="108" text-anchor="middle" fill="white" font-size="21">submission.cpp</text><text x="660" y="137" text-anchor="middle" fill="white">1ファイル</text>
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="currentColor"/></marker></defs>
  </svg>
  <article><h2><a href="amalgamate.html">amalgamate.py</a></h2><p>quoted includeだけを再帰展開します。重複は1回、循環は明確なエラーです。provenanceコメントでURLとcommitも確認できます。</p><p><code>python3 tools/amalgamate.py main.cpp -o submission.cpp</code></p></article>
</main>
